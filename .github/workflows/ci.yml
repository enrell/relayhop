name: Check
on:
  push:
    paths-ignore:
      # Docs-only changes can't break the build; don't burn CI minutes.
      - '**.md'
      - 'docs/**'
      - 'packaging/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'packaging/**'

permissions:
  contents: read

jobs:
  check:
    # Linux only: the Windows leg takes ~2x longer on github-hosted
    # runners and rarely breaks (see windows.yml, which covers Windows
    # nightly, on demand, and on release builds).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
