name: Release binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/relayhop
          cp target/release/relayhop README.md LICENSE dist/relayhop/
          cp -r assets docs dist/relayhop/
          tar -C dist -czf dist/relayhop-linux-x64.tar.gz relayhop
          cd dist
          sha256sum relayhop-linux-x64.tar.gz > relayhop-linux-x64.sha256
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/relayhop -Force
          Copy-Item target/release/relayhop.exe, README.md, LICENSE dist/relayhop/
          Copy-Item assets, docs dist/relayhop/ -Recurse
          Compress-Archive dist/relayhop/* dist/relayhop-windows-x64.zip
          $hash = (Get-FileHash dist/relayhop-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  relayhop-windows-x64.zip" | Set-Content dist/relayhop-windows-x64.sha256
          # Raw binary for direct download + the PowerShell installer.
          Copy-Item target/release/relayhop.exe dist/relayhop.exe
          $exeHash = (Get-FileHash dist/relayhop.exe -Algorithm SHA256).Hash.ToLower()
          "$exeHash  relayhop.exe" | Set-Content dist/relayhop.exe.sha256
      - name: Build Microsoft Store submission package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: relayhop-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.msix
            dist/*.sha256
          if-no-files-found: error
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          generate_release_notes: true
